modLoader="javafml"
loaderVersion="${loader_version_range}"
issueTrackerURL="https://github.com/Christofmeg/TinkersMossyModifier/issues"
license="${mod_license}"
[[mods]]
    modId="${mod_id}"
    version="${mod_version}"
    displayName="${mod_name}"
    displayURL="https://github.com/Christofmeg/TinkersMossyModifier"
    authors="${mod_authors}"
    description='''${mod_description}'''
[[dependencies.${mod_id}]]
    modId="forge"
    mandatory=true
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="minecraft"
    mandatory=true
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
[[dependencies.${mod_id}]]
    modId="tconstruct"
    mandatory=true
    versionRange="[3.11,)"
    ordering="AFTER"
    side="BOTH"
